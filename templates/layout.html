{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rest Hour Management{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'user/style.css' %}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="{% static 'user/logo.png' %}" alt="Company Logo" class="logo-img">
            <span class="title">Rest Hour Management System</span>
        </div>
        <div class="nav-right">
            <form method="post" action="{% url 'login:logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}" {% endif %}>{{ message }}</li>
                {% endfor %}
        </ul>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
</body>

</html>

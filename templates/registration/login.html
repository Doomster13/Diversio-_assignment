<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Diversio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .login-header p {
            font-size: 14px;
            color: #a0a0b0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d0d0e0;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #6c5ce7;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #6c5ce7;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: #5b4bc4;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .predefined-user-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(108, 92, 231, 0.1);
            border-left: 4px solid #6c5ce7;
            border-radius: 5px;
            font-size: 13px;
            color: #a0a0b0;
        }
        
        .predefined-user-info span {
            color: #fff;
            font-weight: 600;
        }

        .error-messages {
            color: #ff7675;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Sign in to continue to Diversio</p>
    </div>

    {% if form.errors %}
        <div class="error-messages">
            <p>Your username and password didn't match. Please try again.</p>
        </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" class="form-control" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" value="admin">
        </div>
        
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" class="form-control" autocomplete="current-password" required id="id_password" value="admin">
        </div>

        <button type="submit" class="btn-submit">Login</button>
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
    </form>

    <div class="predefined-user-info">
        <p><strong>Demo Mode:</strong> Predefined credentials have been auto-filled.</p>
        <p>Username: <span>admin</span> | Password: <span>admin</span></p>
    </div>
</div>

</body>
</html>
